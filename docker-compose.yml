services:
  portainer:
    image: portainer/portainer-ee:lts@sha256:8166e2376756d1ad3194e336cd1707c28a5764af7acc8bb9f21a5f28d1903566
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data # /var/lib/docker/volumes/portainer_data/_data
      - /opt/docker/rootca/zeus:/certs
    ports:
      - "9443:9443"
    network_mode: bridge
    command:
      - --tlscert
      - /certs/zeus.crt
      - --tlskey
      - /certs/zeus.key
    restart: always
    cgroup: host

volumes:
  portainer_data:
    external: true
