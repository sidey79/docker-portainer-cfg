services:
  portainer:
    image: portainer/portainer-ee:lts@sha256:273e2d4ca3394c20cc6b2e2f3696ebe7dd4f6bb98e7fc15f1d8ba90d8476dae4
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data # /var/lib/docker/volumes/portainer_data/_data
      - /opt/docker/rootca/zeus:/certs
    ports:
      - "9443:9443"
    network_mode: bridge
    command:
      - --tlscert
      - /certs/zeus.crt
      - --tlskey
      - /certs/zeus.key
    restart: always
    cgroup: host

volumes:
  portainer_data:
    external: true
