services:
  portainer:
    image: portainer/portainer-ee:lts@sha256:0cd22f754ac52fcfceb362d5ce8f47ee23a5f6427484db17ebfaa4c8a00f7718
    container_name: portainer
    restart: always
    network_mode: bridge
    cgroup: host
    command:
      - --tlscert
      - /certs/zeus.crt
      - --tlskey
      - /certs/zeus.key
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data # /var/lib/docker/volumes/portainer_data/_data
      - /opt/docker/rootca/zeus:/certs

volumes:
  portainer_data:
    external: true
